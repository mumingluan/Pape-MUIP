<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · Pape MUIP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-mark"><span class="brand">PAPE</span><strong>MUIP</strong></div>
      <h1>管理员登录</h1>
      <p>登录后管理 SDK 账号与 BOOI 玩家数据。</p>
      {{if .Error}}<div class="login-error" role="alert">{{.Error}}</div>{{end}}
      <form class="login-form" method="post" action="/login">
        <label><span>用户名</span><input name="username" autocomplete="username" required autofocus></label>
        <label><span>密码</span><input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">登录</button>
      </form>
    </section>
  </main>
</body>
</html>
