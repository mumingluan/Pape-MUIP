<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Pape MUIP · 管理控制台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-wrap">
      <span class="brand-badge">PAPE</span>
      <strong class="brand-title">MUIP</strong>
      <span class="brand-sub">控制台</span>
    </div>
    <div class="header-tools">
      <div class="server-badge">
        <span class="server-tag">BOOI</span>
        <select id="server" aria-label="选择 BOOI 服务实例"></select>
      </div>
      <span id="health" class="pill status-pill">检查中</span>
      <form class="logout-form" method="post" action="/logout">
        <button class="small logout-btn" type="submit" title="退出登录">退出</button>
      </form>
    </div>
  </header>
  <div class="shell">
    <nav class="app-nav">
      <button class="nav active" data-view="players" type="button">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>玩家数据</span>
      </button>
      <button class="nav" data-view="accounts" type="button">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>SDK 账号</span>
      </button>
      <button class="nav" data-view="reports" type="button">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        <span>用户举报</span>
      </button>
      <button class="nav" data-view="catalog" type="button">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        <span>资源目录</span>
      </button>
      <div class="nav-note">所有业务写操作经由 SDK / BOOI Inner API 执行。名称来自只读 languages.sqlite。</div>
    </nav>
    <main class="app-main">
      <section id="view-players" class="view active">
        <div class="title-row">
          <div>
            <h1>玩家数据</h1>
            <p>思念、皮肤、资产、关卡与剧情进度管理</p>
          </div>
          <div class="actions">
            <button id="uid-sequence" type="button">UID 序列</button>
            <button id="new-player" class="primary" type="button">+ 新建角色</button>
          </div>
        </div>
        <div class="split">
          <aside class="panel list-panel">
            <div class="search">
              <input id="player-query" placeholder="AccountID / OpenID / 名字" autocomplete="off">
              <button id="player-search" type="button">查询</button>
            </div>
            <div id="player-list" class="records"></div>
          </aside>
          <section class="panel detail-panel">
            <div id="player-empty" class="empty">选择一个玩家查看与修改状态</div>
            <div id="player-detail" hidden>
              <div class="mobile-back-bar">
                <button id="player-back-btn" class="back-btn" type="button">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                  <span>返回玩家列表</span>
                </button>
              </div>
              <div id="player-head"></div>
              <input id="sync-import-file" type="file" accept="application/json,.json" hidden>
              <div class="tabs" id="player-tabs" role="tablist">
                <button data-tab="overview" class="active" type="button">概览</button>
                <button data-tab="assets" type="button">资产</button>
                <button data-tab="cards" type="button">思念</button>
                <button data-tab="fashions" type="button">皮肤</button>
                <button data-tab="progress" type="button">剧情进度</button>
                <button data-tab="tasks" type="button">任务</button>
              </div>
              <div id="player-content"></div>
            </div>
          </section>
        </div>
      </section>

      <section id="view-accounts" class="view">
        <div class="title-row">
          <div>
            <h1>SDK 账号</h1>
            <p>手机号、密码、登录令牌与账号生命周期</p>
          </div>
          <button id="new-account" class="primary" type="button">+ 创建账号</button>
        </div>
        <div class="panel">
          <div class="search">
            <input id="account-query" placeholder="账号 ID / 手机号" autocomplete="off">
            <button id="account-search" type="button">查询</button>
          </div>
          <div id="account-list"></div>
        </div>
      </section>

      <section id="view-reports" class="view">
        <div class="title-row">
          <div>
            <h1>用户举报</h1>
            <p>客户端提交的举报事件与原始业务信息</p>
          </div>
          <button id="report-refresh" type="button">刷新记录</button>
        </div>
        <div class="panel">
          <div class="search">
            <input id="report-query" placeholder="角色 ID / 名称 / 内容 / 请求 ID" autocomplete="off">
            <button id="report-search" type="button">查询</button>
          </div>
          <div id="report-summary" class="report-summary" aria-live="polite"></div>
          <div id="report-list" aria-busy="false">
            <div class="empty report-empty">打开此页后加载举报历史</div>
          </div>
          <div id="report-pagination"></div>
        </div>
      </section>

      <section id="view-catalog" class="view">
        <div class="title-row">
          <div>
            <h1>资源目录</h1>
            <p>本地化名称检索与一键发放</p>
          </div>
        </div>
        <div class="panel">
          <div class="search catalog-search">
            <select id="catalog-kind">
              <option value="cards">思念</option>
              <option value="fashions">皮肤</option>
              <option value="items">物品</option>
              <option value="stages">关卡</option>
              <option value="tasks">任务</option>
              <option value="unlocks">系统解锁</option>
              <option value="guides">引导</option>
            </select>
            <input id="catalog-query" placeholder="搜索 ID / 关键字" autocomplete="off">
            <button id="catalog-search" type="button">查询</button>
          </div>
          <p class="hint">一键发放需要先在“玩家数据”中选择目标玩家。</p>
          <div id="catalog-list"></div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="app-modal" aria-labelledby="modal-title">
    <form id="modal-form" class="modal-form">
      <div class="modal-heading">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="modal-close" type="button" aria-label="关闭">×</button>
      </div>
      <p id="modal-message" class="modal-message" hidden></p>
      <div id="modal-fields" class="modal-fields"></div>
      <div class="modal-actions">
        <button id="modal-cancel" type="button">取消</button>
        <button id="modal-submit" class="primary" type="submit">确定</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
